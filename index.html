<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Zmanim Board - לוח זמנים</title>
  <style>
    :root { --bg:#070a0f; --fg:#e8eefc; --muted:#9aa6c0; --accent:#6aa6ff; --card: rgba(255,255,255,.06); --success: #51cf66; --warning: #ffd43b; }
    body { margin:0; background:var(--bg); color:var(--fg); font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    .wrap { max-width: 1400px; margin: 0 auto; padding: 18px; }
    .top { display:flex; gap:14px; align-items:baseline; justify-content:space-between; flex-wrap:wrap; }
    h1 { margin:0; font-size: 28px; letter-spacing:.2px; }
    .sub { color:var(--muted); font-size: 14px; }
    .tabs { display:flex; gap:0; margin: 16px 0 0 0; border-bottom: 1px solid rgba(255,255,255,.08); }
    .tab-btn { background: none; border: none; color: var(--muted); padding: 12px 16px; cursor: pointer; font-size: 14px; font-weight: 500; border-bottom: 2px solid transparent; transition: all 0.2s; }
    .tab-btn:hover { color: var(--fg); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
    .card { background:var(--card); border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 14px 14px; }
    .row { display:flex; justify-content:space-between; gap:12px; align-items:baseline; }
    .label { color:var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing:.6px; }
    .label.hebrew { text-transform:none; font-size:14px; }
    .time { font-size: 32px; font-weight: 700; }
    .time.small { font-size: 26px; }
    .fine { color:var(--muted); font-size: 12px; margin-top: 8px; line-height: 1.35; }
    .section { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
    .section .panel { background:rgba(255,255,255,.03); padding:10px; border-radius:10px }
    .flags { margin-top:8px; color:var(--muted); }
    .footer { margin-top: 14px; display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap; color:var(--muted); font-size: 12px; }
    .shabbat { grid-column: 1 / -1; text-align:center; }
    .calendar-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; margin-top: 14px; }
    .day-card { background:var(--card); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; padding: 16px; }
    .day-card.shabbat { border-color: var(--warning); background: rgba(255, 212, 59, .08); }
    .day-card.today { border-color: var(--success); background: rgba(81, 207, 102, .08); }
    .day-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,.1); padding-bottom: 10px; }
    .day-date { font-weight: 700; font-size: 15px; }
    .day-hebrew { font-size: 13px; color: var(--muted); }
    .day-badge { font-size: 11px; padding: 3px 8px; border-radius: 4px; background: rgba(255,212,59,.2); color: var(--warning); font-weight: 600; }
    .day-badge.today { background: rgba(81,207,102,.2); color: var(--success); }
    .zmanim-list { display:flex; flex-direction: column; gap: 10px; }
    .zman-item { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 8px; background: rgba(255,255,255,.02); border-radius: 6px; font-size: 13px; }
    .zman-label { color: var(--fg); }
    .zman-time { font-weight: 600; color: var(--accent); font-size: 14px; text-align: right; min-width: 60px; }
    .calendar-controls { display:flex; gap:12px; margin-bottom:16px; }
    button { background: var(--accent); color: var(--bg); border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; transition: opacity 0.2s; }
    button:hover { opacity: 0.8; }
    .loading { text-align:center; padding:40px; color:var(--muted); }
    .spinner { display:inline-block; width:20px; height:20px; border:3px solid rgba(255,255,255,.1); border-top-color:var(--accent); border-radius:50%; animation:spin 0.6s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media (max-width: 720px){ .grid{ grid-template-columns: 1fr; } .time{ font-size: 28px; } .section{ grid-template-columns: 1fr } .calendar-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Zmanim Board - לוח זמנים</h1>
        <div class="sub" id="todayLine">Loading…</div>
      </div>
      <div class="sub" id="refreshLine"></div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="daily">Daily / יומי</button>
      <button class="tab-btn" data-tab="month">Hebrew Month / לוח חודשי</button>
    </div>

    <div id="daily" class="tab-content active">
      <div class="section">
        <div class="panel" id="todaySection">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div style="font-weight:700">Today / היום</div>
            <div class="flags" id="todayFlags"></div>
          </div>
          <div class="grid" id="todayGrid"></div>
        </div>

        <div class="panel" id="tomorrowSection">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div style="font-weight:700">Tomorrow / מחר</div>
            <div class="flags" id="tomorrowFlags"></div>
          </div>
          <div class="grid" id="tomorrowGrid"></div>
        </div>
      </div>
    </div>

    <div id="month" class="tab-content">
      <div class="calendar-controls">
        <button id="prevBtn">← Prev Month</button>
        <div id="monthTitle" style="font-size: 16px; font-weight: 600; color: var(--fg); flex: 1;"></div>
        <button id="nextBtn">Next Month →</button>
      </div>
      <div id="calendarContainer" class="calendar-grid"></div>
    </div>

    <div class="footer">
      <div id="debugLine"></div>
      <div>Location: Chestnut Ridge, NY | Auto-updates every minute</div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
